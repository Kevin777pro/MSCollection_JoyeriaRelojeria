name: "API Security Analysis"
on:
  push:
    branches: [ Grupo2, develop ]
  pull_request:
    branches: [ Grupo2, develop ]
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  codeql-dotnet:
    name: "CodeQL - .NET API"
    runs-on: ubuntu-latest
    
    steps:
    - name: "Checkout código"
      uses: actions/checkout@v4
      
    - name: "Setup .NET"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0'
          
    - name: "Inicializar CodeQL"
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        
    - name: "Buscar y construir proyecto API específico"
      run: |
        echo "Buscando MS-Collection_WbApi.csproj..."
        if [ -f "MS-Collection_WbApi/MS-Collection_WbApi.csproj" ]; then
          echo "✅ Proyecto API encontrado"
          cd "MS-Collection_WbApi"
          dotnet restore "MS-Collection_WbApi.csproj"
          dotnet build "MS-Collection_WbApi.csproj" --configuration Release --no-restore
        else
          echo "❌ Proyecto API no encontrado"
          find . -name "MS-Collection_WbApi.csproj" -type f
          exit 1
        fi
        
    - name: "Analizar con CodeQL"
      uses: github/codeql-action/analyze@v3

  nuget-audit:
    name: "Auditoría NuGet"
    runs-on: ubuntu-latest
    
    steps:
    - name: "Checkout código"
      uses: actions/checkout@v4
      
    - name: "Setup .NET"
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0'
        
    - name: "Ejecutar auditoría NuGet en proyecto específico"
      run: |
        if [ -f "MS-Collection_WbApi/MS-Collection_WbApi.csproj" ]; then
          cd "MS-Collection_WbApi"
          dotnet list "MS-Collection_WbApi.csproj" package --vulnerable --include-transitive || true
        else
          echo "Proyecto API no encontrado para auditoría"
          exit 0
        fi